[workspace]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64", "linux-aarch64"]
name = "ghost"
conda-pypi-map = { "conda-forge" = "/capstor/scratch/cscs/tnanni/pixi_cache/compressed_mapping.json" }

[system-requirements]
cuda = "12.6"

[dependencies]
python = "3.12.*"
# pymomentum from conda-forge; it will pull in a CPU pytorch as its conda dep.
# The actual CUDA pytorch is installed afterwards via the `setup-cuda` task.
# pymomentum = ">=0.1.90"
pip = "*"
pytorch = ">=2.0,<3"
numpy = ">=1.24.4"
tqdm = ">=4.66.1"
pillow = ">=12.2.0,<13"
scikit-learn = ">=1.8.0,<2"
pyyaml = ">=6.0.3,<7"
wandb = ">=0.16.0"
huggingface_hub = ">=1.14.0,<2"
rich = ">=14.3.2"
tmux = ">=3.3"
gxx = ">=9"
cuda-toolkit = "12.6.*"
einops = ">=0.8.2,<0.9"
safetensors = ">=0.7.0,<0.8"
pango = ">=1.56.4,<2"
ffmpeg = ">=4.4.2,<9"
manimpango = ">=0.6.0,<0.7"
cairo = ">=1.18.4,<2"
pycairo = ">=1.29.0,<2"
xorg-libx11 = "*"
xorg-xorgproto = "*"

[pypi-options]
# SAM-2 and groundingdino import torch at build time; build them inside the
# conda env (where conda's torch is already present) rather than in isolation.
no-build-isolation = ["groundingdino", "SAM-2", "detectron2"]
dependency-overrides = { iopath = ">=0.1.7", pyopengl = ">=3.1.0" }


[pypi-dependencies]
mhr = { path = "MHR", editable = true }
sam-3d-body = { path = "sam-3d-body", editable = true }
sam3 = {path = "sam3", editable = true}
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git", rev = "a1ce2f9" }
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "07444410f1e33f402353b99d6ccd26bd31e469e8" }
transformers = ">=4.0"
addict = "*"
yapf = "*"
timm = ">=1.0.24, <2"
opencv-python = ">=4.13.0.92, <5"
supervision = ">=0.22.0"
pycocotools = ">=2.0.11, <3"
hydra-core = ">=1.3.2, <2"
iopath = ">=0.1.7"
# decord = ">=0.6.0, <0.7"
smplx = ">=0.1.28, <0.2"
pytorch-lightning = ">=2.6.1, <3"
pyrender = ">=0.1.45"
pyopengl = ">=3.1.0"
yacs = ">=0.1.8, <0.2"
tyro = ">=0.9.0"
viser = ">=0.2.0"
scikit-image = ">=0.26.0, <0.27"
einops = ">=0.8.2, <0.9"
dill = ">=0.4.1, <0.5"
pandas = ">=3.0.1, <4"
pyrootutils = ">=1.0.4, <2"
webdataset = ">=1.0.2, <2"
roma = ">=1.5.6, <2"
joblib = "*"
seaborn = ">=0.13.2, <0.14"
wandb = ">=0.25.0"
fvcore = ">=0.1.5.post20221221, <0.2"
tensorboard = ">=2.20.0, <3"
huggingface-hub = ">=1.4.1, <2"
loguru = ">=0.7.3, <0.8"
optree = "*"
smplfitter = ">=0.4.2"
hatchling = ">=1.28.0, <2"
rerun-sdk = ">=0.21.0"

[target.linux-64.dependencies]
pymomentum = ">=0.1.90"

[target.linux-64.pypi-dependencies]
decord = ">=0.6.0, <0.7"

[target.linux-aarch64.dependencies]
# Build deps for decord (no aarch64 wheels on PyPI — built from source)
cmake = ">=3.21"
ninja = "*"
pkg-config = "*"
ffmpeg = ">=4, <5"
# Build deps for pymomentum (conda-forge package is linux-64 only — built from source)
eigen = "3.4.*"
boost-cpp = "*"
fmt = ">=8"
spdlog = ">=1.9"
nlohmann_json = ">=3.11"
re2 = "*"
dispenso = "*"
ceres-solver = "*"
glog = "*"
pybind11 = "*"
cli11 = "*"
ezc3d = "*"
ms-gsl = "*"
fx-gltf = "*"
indicators = ">=2.3"
sophus = "*"
openfbx = "*"
urdfdom = "*"
cuda-nvtx = "*"
patchelf = "*"


[tasks]
# Replaces the conda CPU-only torch with a CUDA 12.6 build from PyTorch's index.
# Run this once after `pixi install`: pixi run setup-cuda
# Installs the CUDA 12.6 build of the SAME torch version that pymomentum depends on
# (currently 2.7.1). Same version = ABI-compatible, so pymomentum keeps working.
# setup-cuda = "python -m pip install --force-reinstall 'torch==2.7.1+cu128' 'torchvision==0.22.1+cu128' --index-url https://download.pytorch.org/whl/cu128 && python -m pip install --no-build-isolation 'git+https://github.com/facebookresearch/pytorch3d.git'"
download-model = "python -c \"from huggingface_hub import snapshot_download; snapshot_download(repo_id='facebook/sam3', local_dir='checkpoints', local_dir_use_symlinks=False)\""
install-hbp = "python -m pip install -e ./human_body_prior --no-deps"

[target.linux-64.tasks]
setup-cuda = "python -m pip install --force-reinstall 'torch==2.7.1+cu128' 'torchvision==0.22.1+cu128' --index-url https://download.pytorch.org/whl/cu128 && python -m pip install --no-build-isolation 'git+https://github.com/facebookresearch/pytorch3d.git'"

[target.linux-aarch64.pypi-dependencies]
scikit-build-core = "*"
drjit = "*"

[target.linux-aarch64.tasks]
setup-cuda = "python -m pip install --force-reinstall 'torch==2.7.1+cu128' --index-url https://download.pytorch.org/whl/cu128 && python -m pip install --no-build-isolation 'git+https://github.com/facebookresearch/pytorch3d.git'"
build-torchvision = "bash build_torchvision_aarch64.sh"
build-arrow = "mkdir -p /tmp/arrow_src /tmp/arrow_build /tmp/arrow_install && curl -sL https://github.com/apache/arrow/releases/download/apache-arrow-18.0.0/apache-arrow-18.0.0.tar.gz -o /tmp/arrow_src/arrow.tar.gz && tar xf /tmp/arrow_src/arrow.tar.gz -C /tmp/arrow_src --strip-components=1 && cmake -S /tmp/arrow_src/cpp -B /tmp/arrow_build --preset ninja-release-minimal -DARROW_BOOST_USE_SHARED=OFF -DARROW_BUILD_SHARED=OFF -DARROW_BUILD_STATIC=ON -DARROW_COMPUTE=OFF -DARROW_IPC=ON -DARROW_JEMALLOC=OFF -DARROW_MIMALLOC=OFF -DBOOST_SOURCE=BUNDLED -DCMAKE_INSTALL_PREFIX=/tmp/arrow_install -DCMAKE_INSTALL_LIBDIR=lib -Dxsimd_SOURCE=BUNDLED -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && cmake --build /tmp/arrow_build -j$(nproc) && cmake --install /tmp/arrow_build"
build-rerun-sdk = "curl -sL https://github.com/rerun-io/rerun/releases/download/0.28.2/rerun_cpp_sdk-0.28.2-multiplatform.zip -o /tmp/rerun_cpp_sdk.zip && mkdir -p /tmp/rerun_sdk_src /tmp/rerun_sdk_build /tmp/rerun_sdk_install && unzip -o /tmp/rerun_cpp_sdk.zip -d /tmp/rerun_sdk_src && cmake -S /tmp/rerun_sdk_src/rerun_cpp_sdk -B /tmp/rerun_sdk_build -DRERUN_DOWNLOAD_AND_BUILD_ARROW=OFF -DRERUN_ARROW_LINK_SHARED=OFF -DArrow_DIR=/tmp/arrow_install/lib/cmake/Arrow -DCMAKE_INSTALL_PREFIX=/tmp/rerun_sdk_install -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && cmake --build /tmp/rerun_sdk_build -j$(nproc) && cmake --install /tmp/rerun_sdk_build"
install-pymomentum = "bash install_pymomentum_aarch64.sh"
install-decord = "tmpdir=$(mktemp -d) && git clone --recursive https://github.com/dmlc/decord.git $tmpdir && mkdir -p $tmpdir/build && cmake -S $tmpdir -B $tmpdir/build -DUSE_CUDA=0 -DCMAKE_BUILD_TYPE=Release && make -C $tmpdir/build -j$(nproc) && python -m pip install $tmpdir/python"
