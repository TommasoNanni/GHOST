data:
  egoexo_data_root: null
  # centered_train exists only as centered_train.sqsh; capstor is Lustre and refuses
  # a FUSE mount over it, so jobs mount the archive node-locally at this path
  # (see bash_jobs/rich_pipeline_v3.sh). Valid only inside a job that mounted it.
  rich_data_root: "/tmp/centered_train"
  rich_gt_dir: "/capstor/scratch/cscs/tnanni/datasets/rich"
  egohumans_data_root: "/capstor/scratch/cscs/tnanni/datasets/egohumans"
  rich_max_side: 1440  # resize RICH frames so longest side <= this before SAM3; null to skip
  egohumans_max_side: 1440  # resize EgoHumans frames so longest side <= this before SAM3; null to skip
  egoexo4d_frames_root: "/capstor/scratch/cscs/tnanni/datasets/egoexo4d/frames"
  egoexo4d_output_dir: "/iopsstor/scratch/cscs/tnanni/ghost_outputs/egoexo4d"
  egoexo4d_max_side: 1440  # resize EgoExo4D frames (3840×2160) before SAM3; null to skip
  rich_frames_base_dir: "/tmp/rich_frames"  # writable dir for resized frames (needed when data root is read-only)
  output_directory: "/iopsstor/scratch/cscs/tnanni/ghost_outputs/rich_train"
  egohumans_output_directory: "/iopsstor/scratch/cscs/tnanni/ghost_outputs/egohumans_segmentation_test"
  slice: null # Number of scenes to load (null = all)
  exclude_egocentric: true # Exclude egocentric videos for simplicity
  smplx_model_path: "body_models/SMPLX_NEUTRAL.pkl"
  mhr_model_path: "MHR/assets"
  vggt_omega_checkpoint: "checkpoints/vggt_omega/vggt_omega_1b_512.pt"
  droid_weights: "/capstor/scratch/cscs/tnanni/ghost_checkpoints/droid.pth"
  fusion_output_dir: "fusion_outputs"

segmentation:
  checkpoint_path: "checkpoints/sam3/sam3.pt" # Path to SAM3 checkpoint; null = auto-download from HuggingFace
  text_prompt: "person" # Text query for SAM3 detection
  redetect_interval: 5 # Add text prompt every N frames so late arrivals are detected
  new_det_thresh: 0.5 # Min score for a detection to spawn a new track (model default 0.7; lower for 4K/distant people)
  score_threshold_detection: 0.5 # Min score to pass NMS/matching gate (model default 0.5)

parameters_extraction:
  reid_threshold: 0.55
  reid_match_window: 20 # Number of frames to retry ReID matching for new tracks
  sam3d_id: "facebook/sam-3d-body-dinov3"
  sam3d_step: 1 # Predict using sam3d every sam3d_step frames
  bbox_padding: 0.2 # Padding added to the bounding box before cropping the image for SAM3D.
  # Cross-view re-identification (run once per scene after all per-video estimation)
  cross_view_reid_threshold: 0.5 # Min hybrid similarity to accept a cross-view match
  cross_view_appearance_weight: 0.3 # Weight of DINOv3 appearance features
  cross_view_shape_weight: 0.2 # Weight of SMPL-X shape (beta) features
  cross_view_pose_weight: 0.5 # Weight of canonical joint sequence (root-relative 3D keypoints)
  geo_reid_distance_threshold: 0.5 # First-pass max median world-space distance (m) for background ReID
  geo_reid_second_pass_threshold: 1.5 # Second-pass threshold for displaced nodes + singletons
  slam_cams: null  # List of camera IDs to run DROID-SLAM on, e.g. ["cam_10"]. null = all cameras

synchronization:
  enabled: false  # Set true to run temporal sync before camera alignment (uses random-shift evaluation)

fusion:
  # New run: the old checkpoint (checkpoints/fusion_module/best.pt, backed up in
  # checkpoints/fusion_module_paper_backup) was trained on MISALIGNED confidence.
  checkpoint_dir: "checkpoints/fusion_r0"
  use_wandb: true
  # Feed per-joint confidence to the fusion attention, correctly ordered
  # (data/fusion_dataset.py remaps canonical SMPL-X -> packed-pose layout).
  # OFF for the R0/R1/R2 comparison: the confidence bias is a third variable and
  # would make the two changes under test unattributable.
  use_joint_confidence: false
  architecture:
    embedding_dimension: 128
    temporal_window: 128
    max_temporal_len: 2048  # PE table size — must be >= longest sequence in the dataset
    num_heads: 8
    num_layers: 4
    dropout: 0.1
    max_cameras: 64
    # CHANGE 2 — kinematic-tree hard mask on the joint-attention axis: a joint
    # may attend only to joints within k edges of it in the SMPL-X tree (the
    # diagonal is always open). null disables it, which is bit-identical to the
    # pre-change model. k=2 keeps ~10.6% of pairs.
    # R0/R1 override this to null on the command line; R2 uses it as-is.
    kintree_mask_k: 2
    # ── v3 only (fusion/fusion_module_v3.py) — ignored by v2 ──────────────────
    # The module predicts a CORRECTION to the visibility-weighted chordal mean of
    # the per-camera estimates instead of the pose itself, and its tokens carry
    # each camera's DEVIATION from that mean instead of its absolute rotation.
    # Parameter shapes are unchanged, so a v3 checkpoint loaded with these flags
    # wrong produces silent garbage rather than an error — they are persisted in
    # model_config and restored by every loader.
    residual_head: true
    centered_input: true
    # LR multiplier for the zero-initialised output layer. Zero weights mean the
    # transformer body receives gradients scaled by ||W||, which starts at 0 and
    # grows at ~lr/step; a larger LR on this one layer removes that warm-up ramp.
    # 1.0 disables the boost.
    head_lr_mult: 10.0
  loss:
    VPoser_path: "checkpoints/V02_05/"
    pose_mse_weight: 0.05
    shape_mse_weight: 0.1
    epipolar_weight: 10.0
    temporal_weight: 0.0   # off: not used by the fusion module that trained well
    bone_length_weight: 0.01
    camera_rotation_mse_weight: 10.0
    camera_translation_mse_weight: 1.0
    gt_translation_mse_weight: 1.0
    triangulation_weight: 0.5
    translation_mse_weight: 1.0
    shape_reg_weight: 1.0
    translation_temporal_weight: 0.1
    vposer_weight: 0.0     # off: was ~75% of total loss, never part of the good run
    joint_position_weight: 1.0
    # CHANGE 1 — rebalance the objective.
    # ~70% of L_joint's magnitude came from the 30 hand joints (FK makes a joint's
    # weight scale with its descendant count) while the trunk got ~2%, and no
    # evaluation metric looks at fingers. So restrict L_joint to root + the 21
    # body joints, and keep hand supervision in L_pose, which weights joints
    # equally. Weights are mean-normalised, so lambda_pose stays 0.05.
    # R0 overrides these to false / 1.0 on the command line.
    joint_position_body_only: true
    pose_hand_weight: 3.0
    pose_body_weight: 1.0
    pose_face_weight: 1.0
  training:
    max_epochs: 400
    lr: 0.0001
    camera_lr: 0.005
    batch_size: 1
    grad_clip: 1.0
    scheduler: cosine  # cosine | plateau | null
    patience: null  # early stopping patience (null to disable)
